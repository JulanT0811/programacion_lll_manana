<!DOCTYPE html>
<head>
</head>
<body>
    <p>Ejemplo de Formulario Simple - Gestión de Póliza de Seguro</p>
    <form action="procesar.php" method="post">

        <table border="0">
            <tr>
                <th >
                    <label for="nombre">Nombre del Asegurado</label> 
                    <input type="text" id="nombre" name="nombre">
                </th>
                <th>
                    <label for="correo">Correo Electrónico</label> 
                    <input type="email" id="correo" name="correo">
                </th>
            </tr>
            <tr>
                <th >
                    <label for="fecha">Fecha de Inicio de Póliza</label> 
                    <input type="date" id="fecha" name="fecha">
                </th>
                <th>
                    <label for="color">Tipo de Seguro (Color ilustrativo)</label> 
                    <input type="color" id="color" name="color">
                </th>
            </tr>
            <tr>
                <td >
                    <label for="color">Género del Asegurado:</label>  
                    <input type="radio" id="m" name="genero" value="M"><label for="m">Masculino</label>
                    <input type="radio" id="f" name="genero" value="F"><label for="m">Femenino</label>
                </td>
                <td>
                    <label for="pais">País de Residencia</label> 
                    <select id="pais" name="pais">
                        <option value="">Seleccione ...</option>
                        <option value="ec">Ecuador</option>
                        <option value="mx">México</option>
                        <option value="ve">Venezuela</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td >
                    <label for="comentarios">Comentarios sobre la Póliza:</label>  
                    <textarea  id="comentarios" name="comenarios" rows="5"></textarea>
                </td>
                <td>
                    <input type="checkbox"  id="acepto" name="acepto" required>
                    <label for="acepto">Acepto los términos y condiciones</label> 
                </td>
            </tr>
        </table>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpiar">
        
    </form>
</body>
</html>
